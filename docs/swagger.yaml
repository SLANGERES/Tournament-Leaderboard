basePath: /v1
definitions:
  models.CreateAdmin:
    properties:
      email:
        type: string
      id:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - email
    - password
    - username
    type: object
  models.CreateUser:
    properties:
      email:
        type: string
      id:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - email
    - password
    - username
    type: object
  models.GetTournamentParticipantResponse:
    properties:
      score:
        description: Starts at 0
        type: integer
      user_id:
        type: string
      username:
        description: SK
        type: string
    type: object
  models.LogInAdmin:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  models.LoginUser:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  models.Problem:
    properties:
      description:
        type: string
      input_format:
        type: string
      max_score:
        type: integer
      output_format:
        type: string
      test_case:
        $ref: '#/definitions/models.TestCase'
      title:
        type: string
    type: object
  models.TestCase:
    properties:
      input:
        type: string
      output:
        type: string
    type: object
  models.Tournament:
    properties:
      created_at:
        type: string
      creator_id:
        type: string
      description:
        type: string
      name:
        type: string
      tournament_id:
        type: string
    type: object
  util.ErrorResponse:
    properties:
      error:
        type: string
      success:
        type: boolean
    type: object
info:
  contact:
    email: karannautiyal22@gmail.com
    name: API Support
  description: API for Coding managing tournaments, admins, and users.
  title: Tournament Leaderboard API
  version: "1.0"
paths:
  /admin/login:
    post:
      consumes:
      - application/json
      description: Authenticate an admin and return JWT in cookie
      parameters:
      - description: Admin Login Data
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/models.LogInAdmin'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            type: string
        "400":
          description: Bad request
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Admin login
      tags:
      - Admin
  /admin/signup:
    post:
      consumes:
      - application/json
      description: Register a new admin account
      parameters:
      - description: Admin Signup Data
        in: body
        name: admin
        required: true
        schema:
          $ref: '#/definitions/models.CreateAdmin'
      produces:
      - application/json
      responses:
        "201":
          description: Admin created successfully
          schema:
            type: string
        "400":
          description: Bad request
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Admin signup
      tags:
      - Admin
  /tournaments:
    post:
      consumes:
      - application/json
      description: Admin-only endpoint to create a new tournament
      parameters:
      - description: Bearer JWT
        in: header
        name: Authorization
        required: true
        type: string
      - description: Tournament details
        in: body
        name: tournament
        required: true
        schema:
          $ref: '#/definitions/models.Tournament'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Tournament'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Create a new tournament
      tags:
      - tournaments
  /tournaments/{id}:
    get:
      description: Returns details of a tournament by its ID
      parameters:
      - description: Tournament ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Tournament'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Get tournament by ID
      tags:
      - tournaments
  /tournaments/{id}/participants:
    get:
      description: Returns a list of participants in a given tournament
      parameters:
      - description: Tournament ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.GetTournamentParticipantResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Get all participants for a tournament
      tags:
      - tournaments
  /tournaments/addproblem/{id}:
    post:
      consumes:
      - application/json
      description: Admin-only endpoint to add a coding problem to a tournament
      parameters:
      - description: Bearer JWT
        in: header
        name: Authorization
        required: true
        type: string
      - description: Tournament ID
        in: path
        name: id
        required: true
        type: string
      - description: Problem details
        in: body
        name: problem
        required: true
        schema:
          $ref: '#/definitions/models.Problem'
      produces:
      - application/json
      responses:
        "200":
          description: Problem added successfully
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Add a problem to a tournament
      tags:
      - tournaments
  /tournaments/addtestcase/{id}:
    post:
      consumes:
      - application/json
      description: Admin-only endpoint to add a test case to a problem
      parameters:
      - description: Bearer JWT
        in: header
        name: Authorization
        required: true
        type: string
      - description: Problem ID
        in: path
        name: id
        required: true
        type: string
      - description: Test case details
        in: body
        name: testcase
        required: true
        schema:
          $ref: '#/definitions/models.TestCase'
      produces:
      - application/json
      responses:
        "200":
          description: Test case added successfully
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Add a new test case to a problem
      tags:
      - tournaments
  /tournaments/ongoing:
    get:
      description: Returns a list of all ongoing tournaments
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Tournament'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Get all ongoing tournaments
      tags:
      - tournaments
  /tournaments/ongoing/addparticipant/{id}:
    post:
      description: Allows a logged-in user to join an ongoing tournament
      parameters:
      - description: Bearer JWT
        in: header
        name: Authorization
        required: true
        type: string
      - description: Tournament ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Participant added successfully
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/util.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/util.ErrorResponse'
      summary: Add participant to an ongoing tournament
      tags:
      - tournaments
  /user/login:
    post:
      consumes:
      - application/json
      description: Authenticate an user and return JWT in cookie
      parameters:
      - description: User Login Data
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/models.LoginUser'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            type: string
        "400":
          description: Bad request
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: User login
      tags:
      - User
  /user/signup:
    post:
      consumes:
      - application/json
      description: Register a new User account
      parameters:
      - description: User Signup Data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.CreateUser'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            type: string
        "400":
          description: Bad request
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: User signup
      tags:
      - User
swagger: "2.0"
